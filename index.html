<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPT · Učenje</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--bg:#1a2019;--rail:#151d17;--rail2:#20281f;--paper:#f1ebda;--paper2:#e9e1cc;--ink:#252720;--muted:#756e60;--line:#b9aa8e;--wine:#7b1e2d;--wine2:#57131d;--bronze:#9a7d50;--olive:#334c3a;--olive2:#263a2d;}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% -15%,#344034 0,transparent 34%),linear-gradient(180deg,#242c23,#151a15);color:var(--ink);font-family:Cardo,Georgia,serif}
.page{width:min(1180px,calc(100% - 28px));margin:24px auto 64px;display:grid;grid-template-columns:184px 1fr;background:var(--paper);box-shadow:0 26px 90px #0009,0 0 0 1px #090b0922;min-height:100vh;position:relative;overflow:hidden}
.page:after{content:"";position:absolute;inset:0 0 0 184px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 31px,#6e665307 31px 32px),linear-gradient(90deg,#00000006,transparent 7%,transparent 93%,#00000007)}
.rail{background:#1f241a;color:#d1bd8a;border-right:1px solid #8c7450;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:26px 18px 30px;text-align:center}
.owl-panel{width:calc(100% + 36px);margin:-26px -18px 0;padding:26px 18px 24px;background:#1a1e15;border-bottom:1px solid #8c745044;display:flex;flex-direction:column;align-items:center}
.rail .latin{font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:17px;line-height:1.35;text-transform:uppercase;color:#a91f31;font-weight:600}
.owl-panel .rail-note{color:#f0e7d4}
.rail-rule{width:38px;height:1px;background:#9d8258;margin:16px 0}
.rail-owl{width:138px;height:auto;margin:4px 0 10px;display:block;filter:none;box-shadow:none;border:0;background:#1a1e15;object-fit:contain;isolation:isolate}
.rail-note{font:500 10px 'IBM Plex Mono';letter-spacing:.16em;line-height:1.75;text-transform:uppercase;color:#bda779}
.rail-nav{width:calc(100% + 36px);margin:28px -18px 0;border-top:1px solid #8c745044}
.rail-nav a{display:flex;align-items:center;gap:10px;padding:17px 20px;color:#c9b27f;text-decoration:none;border-bottom:1px solid #8c745033;font:500 11px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;text-align:left}
.rail-nav a.active{background:#e7dec6;color:#262b23}
.rail-nav .mark{width:22px;text-align:center;font-family:Cardo;font-size:20px}
.rail-bottom{margin-top:auto;padding-top:40px}.laurel{font-size:40px;line-height:1;color:#a88c5f;margin-bottom:12px}
.main{position:relative;z-index:1;min-width:0}
.hero{padding:34px 38px 28px;border-bottom:1px solid var(--line);position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start}
.eyebrow{font:600 11px 'IBM Plex Mono';letter-spacing:.22em;text-transform:uppercase;color:#5f594d;margin:6px 0 5px}
.title{font-family:'Cormorant Garamond',Cardo,serif;font-size:clamp(46px,6.3vw,78px);line-height:.8;letter-spacing:.055em;text-transform:uppercase;font-weight:500;margin:7px 0 12px}
.title span{display:block}
.hero-sub{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.22em;text-transform:uppercase;margin-top:16px}
.quote{font-size:17px;font-style:italic;margin:26px 0 0;max-width:620px;color:#474339}
.bust{height:232px;position:relative;overflow:hidden;align-self:start;display:flex;justify-content:flex-end;align-items:flex-start;background:#d8cfbd}
.bust-art{width:100%;height:232px;object-fit:cover;object-position:center top;display:block;filter:none;mix-blend-mode:normal;transform:none;mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 94%,transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 94%,transparent 100%)}
.veil-date{display:none}.exam-date{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:8px 14px;border-top:1px solid #8f8067;border-bottom:1px solid #8f8067;font:600 11px 'IBM Plex Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--wine)}.exam-date b{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.08em;font-weight:600;color:#3d382f}
.stats{display:grid;grid-template-columns:1.55fr .9fr;gap:14px;margin-top:18px;position:relative;z-index:3;clear:both}
.stat{background:#eee6d2cc;border:1px solid #bdaf93;border-radius:13px;box-shadow:inset 0 1px #fff8,0 2px 8px #5b513817;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;min-height:92px}
.stat-symbol{width:48px;display:grid;place-items:center;color:var(--olive)}
.stat-symbol img{width:46px;height:60px;object-fit:cover;object-position:28% 20%;filter:grayscale(1) sepia(.4) saturate(1.4) contrast(1.35);mix-blend-mode:multiply}
.stat-symbol .featherIcon{width:40px;height:56px;object-fit:contain;display:block;filter:none}
.stat-label{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.stat-value{font-size:32px;min-width:64px;text-align:right}
.bar{height:12px;border:1px solid #a89472;border-radius:99px;background:#e5dcc8;overflow:hidden;margin-top:9px;box-shadow:inset 0 1px 3px #796d5644}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--olive2),#496651);transition:.25s}
.content{padding:28px 38px 46px}
.chapter{margin:0 0 4px}
.chapterhead{display:flex;justify-content:space-between;gap:18px;align-items:end;padding:17px 0 8px;border-bottom:1px solid #776d5c}
.chapterhead .name{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;letter-spacing:.025em;text-transform:uppercase}
.chapterhead .range{font:500 11px 'IBM Plex Mono';letter-spacing:.13em;color:#504b42;text-transform:uppercase}
.q{display:grid;grid-template-columns:58px 1fr 38px 38px;gap:12px;align-items:center;min-height:58px;border-bottom:1px solid #c9c0ad;padding:6px 0;transition:.18s}
.q.done .qtitle{opacity:.48;text-decoration:line-through;text-decoration-thickness:1px}.q.flagged{background:linear-gradient(90deg,transparent 0 82%,#7b1e2d0d)}
.num{font-family:'Cormorant Garamond',serif;font-size:30px;color:#514b3f;font-variant-numeric:tabular-nums;text-align:center}.qtitle{font-size:17px;line-height:1.2}
.donebox{appearance:none;width:24px;height:24px;border:1px solid #746d5e;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:transparent}
.donebox:checked:after{content:"✓";font:700 18px Cardo;color:var(--olive)}
.featherToggle{width:29px;height:34px;display:grid;place-items:center;cursor:pointer;position:relative}.featherToggle input{position:absolute;opacity:0;pointer-events:none}
.featherToggle .featherIcon{width:27px;height:37px;object-fit:contain;display:block;filter:grayscale(1) sepia(.1) opacity(.42);transition:.18s;transform:rotate(1deg)}
.featherToggle input:checked + .featherIcon{filter:drop-shadow(0 1px 0 #fff5);transform:rotate(1deg) scale(1.04)}
.daymark{margin-top:26px;display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:14px 0 2px;padding:7px 12px;background:var(--olive);color:#efe6cf;font:600 11px 'IBM Plex Mono';letter-spacing:.16em;text-transform:uppercase}.daymark b{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.1em}.daymark span{font-weight:400;letter-spacing:.1em;opacity:.85}
.pause{margin:22px 0 26px;display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;cursor:pointer;color:#655c4c}
.pause .line{height:1px;background:#927b57}.pause .center{text-align:center;min-width:124px}.pause .scales{display:block;width:48px;height:31px;margin:0 auto 2px;stroke:var(--bronze);fill:none;stroke-width:1.55}
.pause .word{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:.16em;text-transform:uppercase}.pause input{accent-color:var(--olive);vertical-align:-2px;margin-right:7px}.pause.done{opacity:.4}.pause.done .word{text-decoration:line-through}
.redzone{margin-top:46px;padding-top:30px;border-top:2px solid var(--wine);display:none}.redzone.show{display:block}
.redhead{text-align:center;margin-bottom:18px}.redhead .kicker{font:600 10px 'IBM Plex Mono';letter-spacing:.22em;text-transform:uppercase;color:var(--wine)}.redhead h2{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;margin:3px 0 2px;text-transform:uppercase;color:#57131d}.redhead p{margin:0;color:var(--muted);font-size:14px;font-style:italic}
.redq{display:grid;grid-template-columns:58px 1fr 38px;gap:12px;align-items:center;min-height:58px;border-bottom:1px solid #c9c0ad}.redq .donebox:checked:after{color:var(--wine)}
.footer{padding:18px 28px 24px;border-top:1px solid var(--line);font:500 10px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:#777062;text-align:center}
@media(max-width:850px){.page{grid-template-columns:1fr;width:100%;margin:0}.page:after{inset:0}.rail{display:none}.hero-grid{grid-template-columns:1fr}.bust{height:220px;margin-top:4px;justify-content:center;overflow:hidden}.bust-art{width:100%;height:220px;transform:none}.veil-date{left:50%;top:86px;transform:translateX(-50%) rotate(3.5deg);font-size:15px}}
@media(max-width:650px){.hero,.content{padding-left:18px;padding-right:18px}.title{font-size:46px}.hero-sub{font-size:17px}.veil-date{display:none}.exam-date{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:8px 14px;border-top:1px solid #8f8067;border-bottom:1px solid #8f8067;font:600 11px 'IBM Plex Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--wine)}.exam-date b{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.08em;font-weight:600;color:#3d382f}
.stats{grid-template-columns:1fr}.q{grid-template-columns:44px 1fr 31px 31px;gap:6px}.num{font-size:24px}.qtitle{font-size:15px}.chapterhead .range{display:none}.redq{grid-template-columns:44px 1fr 31px}}
.owl-mark{width:112px;height:auto;color:#d7c29a;display:block;margin:8px auto 14px;}
</style>
</head>

function render(){
 const wrap=document.getElementById('questions');wrap.innerHTML='';
 chapters.forEach((c,ci)=>{
   const si=SESS.findIndex(x=>x[0]===c.a);
   if(si>=0){const a=SESS[si][0],b=SESS[si][1];let dn=0;for(let i=a;i<=b;i++)if(state.done[i])dn++;const dm=document.createElement('div');dm.className='daymark';dm.innerHTML=`<b>Dan ${si+1}</b><span>pitanja ${a}–${b} · ${dn}/${b-a+1}</span>`;wrap.appendChild(dm);}
   const sec=document.createElement('section');sec.className='chapter';
   sec.innerHTML=`<div class="chapterhead"><div class="name">${c.name}</div><div class="range">${String(c.a).padStart(2,'0')}—${String(c.b).padStart(2,'0')}</div></div>`;
   for(let n=c.a;n<=c.b;n++){
     const row=document.createElement('div');row.className='q'+(state.done[n]?' done':'')+(state.red[n]?' flagged':'');
     row.innerHTML=`<div class="num">${String(n).padStart(2,'0')}</div><div class="qtitle">${questions[n-1]}</div><input class="donebox" type="checkbox" aria-label="Završeno pitanje ${n}" ${state.done[n]?'checked':''}><label class="featherToggle" aria-label="Crvena zona pitanje ${n}"><input type="checkbox" ${state.red[n]?'checked':''}>${featherSVG}</label>`;
     const [done,red]=row.querySelectorAll('input');
     done.onchange=()=>{state.done[n]=done.checked;save();render()};
     red.onchange=()=>{state.red[n]=red.checked;if(!red.checked) delete state.redDone[n];save();render()};
     sec.appendChild(row);
   }
   wrap.appendChild(sec);
 });
 const redNums=Object.keys(state.red).filter(k=>state.red[k]).map(Number).sort((a,b)=>a-b);
 document.getElementById('redCount').textContent=redNums.length;
 document.getElementById('redBar').style.width=(redNums.length/64*100)+'%';
 const rz=document.getElementById('redzone'),rq=document.getElementById('redQuestions');
 rq.innerHTML='';
 if(redNums.length){rz.classList.add('show');redNums.forEach(n=>{const r=document.createElement('div');r.className='redq';r.innerHTML=`<div class="num">${String(n).padStart(2,'0')}</div><div class="qtitle">${questions[n-1]}</div><input class="donebox" type="checkbox" ${state.redDone[n]?'checked':''}>`;const cb=r.querySelector('input');cb.onchange=()=>{state.redDone[n]=cb.checked;save();render()};rq.appendChild(r)})}else{rz.classList.remove('show')}
 const d=Object.keys(state.done).filter(k=>state.done[k]).length;document.getElementById('doneCount').textContent=d;document.getElementById('progressBar').style.width=(d/64*100)+'%';
}
render();
</script>
